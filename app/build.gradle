plugins { id 'com.android.application' }

android {
    namespace 'com.latchi.remote'
    compileSdk 35

    defaultConfig {
        applicationId "com.latchi.remote"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            storeFile rootProject.file('latchi-remote.jks')
            storePassword 'latchi2026'
            keyAlias 'latchi'
            keyPassword 'latchi2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
